# The Minecraft tunnel token (key "token"), shared by every gateway (this one and the VPS
# gateways) and every relay in namespace minecraft. Create the 1Password item first: a random
# value of 32+ bytes, different from lcm-test's.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: lcm-tunnel
  namespace: minecraft-gw
spec:
  itemPath: "vaults/k8s/items/minecraft-tunnel"
