# Live container migration alerts. Runbook: uorux/live-container-migration docs/operations.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lcm-alerts
  namespace: monitoring
  labels: {release: prometheus}
spec:
  groups:
  - name: lcm.rules
    rules:
    - alert: LcmMigrationFailed
      expr: increase(lcm_migrations_total{outcome="failed"}[15m]) > 0
      labels: {severity: critical}
      annotations:
        summary: "Live migration failed after the source stopped ({{ $labels.instance }})"
        description: "A migration stopped its source but the workload was neither restored nor rolled back. The workload may be down. Run `lcm history` for the error and image location, and `lcm recover` to restore it."
    - alert: LcmGatewayPlayersWaiting
      # Players held at the gateway for 4+ minutes while their server is down: it isn't
      # starting (on-demand wake failed, or a crash). -hold-max (default 5 min) kicks them next.
      expr: (lcm_gateway_held_players > 0) and on(instance, backend) (lcm_gateway_tunnel_down_seconds > 240)
      labels: {severity: critical}
      annotations:
        summary: "Players waiting on {{ $labels.backend }} for {{ $value }}+ s ({{ $labels.instance }})"
        description: "{{ $labels.backend }} has had no server for 4+ minutes while players are held. Check its LivePod (phase, events) and the wake path (lcm_gateway_wakes_total)."
    - alert: LcmGatewayBackendDown
      # A backend with no server for 10 minutes that is not an asleep on-demand LivePod (the
      # LivePod name must equal the backend name for that check), counted only on the gateway
      # serving the VIP, not on standbys (which never hold relays themselves).
      expr: |
        (lcm_gateway_tunnel_down_seconds > 600)
          unless on(instance) (lcm_gateway_vip_active == 0)
          unless on(backend) label_replace(lcm_livepod_running{phase=~"Asleep|Sleeping|Waking"}, "backend", "$1", "livepod", "(.+)")
      labels: {severity: critical}
      annotations:
        summary: "{{ $labels.backend }} has had no server for {{ $value | humanizeDuration }} ({{ $labels.instance }})"
        description: "No relay has connected for over 10 minutes and the backend isn't asleep. Players are held or see 'starting'. Check the server's pod."
    - alert: LcmGatewayDown
      expr: up{job=~".*lcm-gateway.*"} == 0
      for: 5m
      labels: {severity: critical}
      annotations:
        summary: "lcm-gateway {{ $labels.instance }} ({{ $labels.job }}) is not being scraped"
        description: "The gateway holds its players' connections. If it is down, they are disconnected."
    - alert: LcmVIPUnserved
      # Exactly one VIP gateway should be active.
      expr: sum(lcm_gateway_vip_active) != 1
      for: 1m
      labels: {severity: critical}
      annotations:
        summary: "{{ $value }} gateways serve the router-path VIP (want 1)"
        description: "0: router players can't connect (lease not taken: check the lcm-gateway -vip pods). 2: two nodes answer for the VIP (a hung gateway; see docs/router-path.md)."
    - alert: LcmAgentDown
      expr: up{job="lcm-agent"} == 0
      for: 5m
      labels: {severity: warning}
      annotations:
        summary: "lcm-agent down on {{ $labels.instance }}"
        description: "Migrations to or from this node will abort (safely, before the source stops). Check `systemctl status lcm-agent` on the node."
    - alert: LcmMigrationRolledBack
      expr: increase(lcm_migrations_total{outcome="rolled_back"}[15m]) > 0
      labels: {severity: warning}
      annotations:
        summary: "A live migration was rolled back ({{ $labels.instance }})"
        description: "The destination restore failed and the workload was restored on its source node. Clients saw roughly a 10-15 s freeze. See the destination's /var/lib/lcm/logs/*/restore.log."
    - alert: LcmRestoreFailures
      expr: increase(lcm_restores_total{result="failure"}[15m]) > 0
      labels: {severity: warning}
      annotations:
        summary: "lcm-runc restore failures on {{ $labels.instance }}"
        description: "Restore attempts failed on this node; see /var/lib/lcm/lcm-runc.log and the CRIU restore.log."
    - alert: LcmBlackoutSlow
      expr: (increase(lcm_migration_blackout_seconds_count[1h]) - ignoring(le) increase(lcm_migration_blackout_seconds_bucket{le="12"}[1h])) > 0
      labels: {severity: warning}
      annotations:
        summary: "A live migration froze its workload for more than 12 s"
        description: "Clients time out at 30 s. Check lcm_checkpoint_phase_seconds (frozen, final_dump, final_ship) and lcm_restore_seconds to see which step grew."
    - alert: LcmStagingNotCleaned
      expr: lcm_staging_bytes > 0 and on(instance) lcm_agent_inflight_checkpoints == 0 and on(instance) lcm_staged_restores == 0
      for: 30m
      labels: {severity: warning}
      annotations:
        summary: "Checkpoint images left in RAM on {{ $labels.instance }} ({{ $value | humanize1024 }}B in {{ $labels.dir }})"
        description: "A failed migration left images in /var/lib/lcm/{{ $labels.dir }}. If `lcm history` shows nothing that needs them, delete them."
    - alert: LcmStagedRestoreStuck
      expr: lcm_staged_restores > 0
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "A staged restore on {{ $labels.instance }} has not been consumed for 15 min"
        description: "A destination pod never started its container, or the migration was abandoned. Check pods with the lcm.rooty.dev/migration-id annotation."
    - alert: LcmAgentVersionSkew
      expr: count(count by (version) (lcm_agent_build_info)) > 1
      for: 30m
      labels: {severity: warning}
      annotations:
        summary: "lcm-agent versions differ across nodes"
        description: "Finish the rollout before migrating: a restore needs the same relay binary on every node."
    - alert: LcmLivePodNotRunning
      expr: max by (namespace, livepod) (lcm_livepod_running{phase!~"Paused|Asleep|Sleeping"}) == 0
      for: 10m
      labels: {severity: critical}
      annotations:
        summary: "LivePod {{ $labels.namespace }}/{{ $labels.livepod }} has had no running pod for 10 minutes"
        description: "kubectl get livepod -n {{ $labels.namespace }} {{ $labels.livepod }} shows the pod and phase. A pod left on a dead node blocks a new one by design (no two copies); force-delete it once the node is really gone. A fenced source after a failed migration needs `lcm recover`."
    - alert: LcmLivePodControllerAbsent
      expr: sum(lcm_livepod_controller_leader) == 0
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "No lcm-agent is leading the LivePod controller"
        description: "LivePods won't be recreated after a failure. Check lcm-agent logs for leader election errors (Lease kube-system/lcm-livepod-controller)."
