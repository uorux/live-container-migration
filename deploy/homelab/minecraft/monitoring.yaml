# Generated by tools/gen-minecraft.py; edit that, not this.
{
  "apiVersion": "monitoring.coreos.com/v1",
  "kind": "PodMonitor",
  "metadata": {
    "name": "minecraft",
    "namespace": "minecraft"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/part-of": "minecraft"
      }
    },
    "podMetricsEndpoints": [
      {
        "port": "mc-metrics",
        "interval": "30s",
        "relabelings": [
          {
            "sourceLabels": [
              "__meta_kubernetes_pod_label_mc_rooty_dev_pack"
            ],
            "targetLabel": "server"
          }
        ]
      },
      {
        "port": "jmx",
        "interval": "30s",
        "relabelings": [
          {
            "sourceLabels": [
              "__meta_kubernetes_pod_label_mc_rooty_dev_pack"
            ],
            "targetLabel": "server"
          }
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "monitoring.coreos.com/v1",
  "kind": "PrometheusRule",
  "metadata": {
    "name": "minecraft-alerts",
    "namespace": "minecraft",
    "labels": {
      "release": "prometheus"
    }
  },
  "spec": {
    "groups": [
      {
        "name": "minecraft.rules",
        "rules": [
          {
            "alert": "McServerStartTimeout",
            "expr": "increase(lcm_gateway_player_connections_total{result=\"hold_timeout\"}[30m]) > 0",
            "labels": {
              "severity": "warning"
            },
            "annotations": {
              "summary": "Players gave up waiting for {{ $labels.backend }} to start ({{ $labels.instance }})",
              "description": "A wake didn't finish within -hold-max. Check the LivePod's pod: Pending (no node with room), crash loop, or slow boot."
            }
          },
          {
            "alert": "McWakeErrors",
            "expr": "increase(lcm_gateway_wakes_total{result=\"error\"}[15m]) > 0",
            "labels": {
              "severity": "warning"
            },
            "annotations": {
              "summary": "{{ $labels.instance }} can't wake servers",
              "description": "No agent accepted the wake: none reachable on :7790, or the gateway's wake token doesn't match the nodes' /run/lcm/wake-token."
            }
          },
          {
            "alert": "McPodPending",
            "expr": "max by (pod) (kube_pod_status_phase{namespace=\"minecraft\",phase=\"Pending\"}) == 1",
            "for": "5m",
            "labels": {
              "severity": "warning"
            },
            "annotations": {
              "summary": "{{ $labels.pod }} can't be scheduled",
              "description": "Usually no node has the memory request free. Players joining it are held, then kicked."
            }
          },
          {
            "alert": "McVolumeFull",
            "expr": "kubelet_volume_stats_used_bytes{namespace=\"minecraft\"} / kubelet_volume_stats_capacity_bytes{namespace=\"minecraft\"} > 0.85",
            "for": "15m",
            "labels": {
              "severity": "warning"
            },
            "annotations": {
              "summary": "{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full",
              "description": "The CephFS quota stops writes when full (world saves fail). Raise the PVC size in tools/gen-minecraft.py."
            }
          }
        ]
      }
    ]
  }
}
