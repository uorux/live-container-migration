# Generated by tools/gen-minecraft.py; edit that, not this.
# One on-demand LivePod per pack: backend name = LivePod name = hostname label.
# A template change (image, memory) applies at the pack's next wake, never to a running server.
{
  "apiVersion": "lcm.rooty.dev/v1alpha1",
  "kind": "LivePod",
  "metadata": {
    "name": "atm9",
    "namespace": "minecraft"
  },
  "spec": {
    "onDemand": {
      "backend": "atm9",
      "idleAfter": "10m",
      "startAsleep": true
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/part-of": "minecraft",
          "mc.rooty.dev/pack": "atm9"
        }
      },
      "spec": {
        "runtimeClassName": "lcm",
        "priorityClassName": "minecraft",
        "terminationGracePeriodSeconds": 180,
        "securityContext": {
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch"
        },
        "initContainers": [
          {
            "name": "fetch-relay",
            "image": "busybox:1.37",
            "command": [
              "sh",
              "-c",
              "wget -q -O /lcm/lcm-relay http://$HOST_IP:7790/v1/bin/lcm-relay && chmod +x /lcm/lcm-relay"
            ],
            "env": [
              {
                "name": "HOST_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.hostIP"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "lcm-bin",
                "mountPath": "/lcm"
              }
            ]
          }
        ],
        "containers": [
          {
            "name": "mc",
            "image": "MISSING-DIGEST/atm9",
            "command": [
              "/lcm/lcm-relay",
              "run",
              "-gateway",
              "lcm-gateway-vip-tunnel.minecraft-gw.svc.cluster.local:7001",
              "-backend",
              "atm9",
              "-token-file",
              "/secret/token",
              "-minecraft-ready",
              "-proxy-protocol=false",
              "--",
              "/bin/mc-start"
            ],
            "resources": {
              "requests": {
                "cpu": "2",
                "memory": "12Gi"
              },
              "limits": {
                "memory": "13Gi"
              }
            },
            "ports": [
              {
                "name": "mc-metrics",
                "containerPort": 19565
              },
              {
                "name": "jmx",
                "containerPort": 9404
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "lcm-bin",
                "mountPath": "/lcm"
              },
              {
                "name": "secret",
                "mountPath": "/secret",
                "readOnly": true
              },
              {
                "name": "lists",
                "mountPath": "/etc/mc",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "atm9-data"
            }
          },
          {
            "name": "lcm-bin",
            "emptyDir": {}
          },
          {
            "name": "secret",
            "secret": {
              "secretName": "lcm-tunnel"
            }
          },
          {
            "name": "lists",
            "configMap": {
              "name": "mc-whitelist",
              "items": [
                {
                  "key": "backend.json",
                  "path": "whitelist.json"
                },
                {
                  "key": "ops-global.json",
                  "path": "ops.json"
                }
              ]
            }
          }
        ]
      }
    }
  }
}
