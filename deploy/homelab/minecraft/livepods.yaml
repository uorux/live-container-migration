                  "path": "ops.json"
                }
              ]
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "lcm.rooty.dev/v1alpha1",
  "kind": "LivePod",
  "metadata": {
    "name": "sdfs",
    "namespace": "minecraft"
  },
  "spec": {
    "onDemand": {
      "backend": "sdfs",
      "idleAfter": "10m",
      "startAsleep": true
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/part-of": "minecraft",
          "mc.rooty.dev/pack": "sdfs"
        },
        "annotations": {
          "lcm.rooty.dev/pre-migrate": "echo \"say This server is moving to another machine now. You'll stay connected; expect a pause of a few seconds.\" > /tmp/mc-console",
          "lcm.rooty.dev/post-migrate": "if [ \"$LCM_RESULT\" = done ]; then m=\"Move finished (paused for $LCM_BLACKOUT). Carry on!\"; else m=\"The move didn't go through; the server stayed where it was.\"; fi; echo \"say $m\" > /tmp/mc-console"
        }
      },
      "spec": {
        "runtimeClassName": "lcm",
        "priorityClassName": "minecraft",
        "imagePullSecrets": [
          {
            "name": "minecraft-registry-pull"
          }
        ],
        "terminationGracePeriodSeconds": 180,
        "securityContext": {
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch"
        },
        "initContainers": [
          {
            "name": "fetch-relay",
            "image": "busybox:1.37",
            "command": [
              "sh",
              "-c",
              "wget -q -O /lcm/lcm-relay http://$HOST_IP:7790/v1/bin/lcm-relay && chmod +x /lcm/lcm-relay"
            ],
            "env": [
              {
                "name": "HOST_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.hostIP"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "lcm-bin",
                "mountPath": "/lcm"
              }
            ]
          }
        ],
        "containers": [
          {
            "name": "mc",
            "image": "git.rooty.dev/minecraft/sdfs@sha256:f563267e51cf45c7cc3899563bbaff4ce8e9d9774a026e5073605b01f3808fa3",
            "command": [
              "/lcm/lcm-relay",
              "run",
              "-gateway",
              "lcm-gateway-vip-tunnel.minecraft-gw.svc.cluster.local:7001,100.125.234.26:7000,100.92.154.30:7000",
              "-backend",
              "sdfs",
              "-token-file",
              "/secret/token",
              "-minecraft-ready",
              "-proxy-protocol=false",
              "--",
              "/bin/mc-start"
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "7Gi"
              },
              "limits": {
                "memory": "8Gi"
              }
            },
            "ports": [
              {
                "name": "mc-metrics",
                "containerPort": 19565
              },
              {
                "name": "jmx",
                "containerPort": 9404
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "lcm-bin",
                "mountPath": "/lcm"
              },
              {
                "name": "secret",
                "mountPath": "/secret",
                "readOnly": true
              },
              {
                "name": "lists",
                "mountPath": "/etc/mc",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "sdfs-data"
            }
          },
          {
            "name": "lcm-bin",
            "emptyDir": {}
          },
          {
            "name": "secret",
            "secret": {
              "secretName": "lcm-tunnel"
            }
          },
          {
            "name": "lists",
            "configMap": {
              "name": "mc-whitelist",
              "items": [
                {
                  "key": "global.json",
                  "path": "whitelist.json"
                },
                {
                  "key": "ops-global.json",
                  "path": "ops.json"
                }
              ]
            }
          }
        ]
      }
    }
  }
}
