# Mirrors the production cilium-config (1.20.2): cluster-pool IPAM, VXLAN tunnel, KPR, LB-IPAM + L2 announcements.
k8sServiceHost: 192.168.100.11
k8sServicePort: 6443
kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    clusterPoolIPv4MaskSize: 24
l2announcements:
  enabled: true
externalIPs:
  enabled: true
devices: eth1
operator:
  replicas: 1
hubble:
  enabled: true
  relay:
    enabled: false
