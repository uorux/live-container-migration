# lcm-gateway: holds players' TCP connections; the migrating server's relay dials in.
# Lab: the binary comes from the node's lcm-agent (no image registry needed).
apiVersion: v1
kind: Secret
metadata: {name: lcm-tunnel}
stringData: {token: lab-tunnel-token-not-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lcm-gateway, labels: {app: lcm-gateway}}
spec:
  replicas: 1
  selector: {matchLabels: {app: lcm-gateway}}
  template:
    metadata: {labels: {app: lcm-gateway}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node1}
      initContainers:
      - name: fetch
        image: busybox:1.37
        command: ["sh", "-c", "wget -q -O /lcm/lcm-gateway http://$HOST_IP:7790/v1/bin/lcm-gateway && chmod +x /lcm/lcm-gateway"]
        env: [{name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}]
        volumeMounts: [{name: bin, mountPath: /lcm}]
      containers:
      - name: gateway
        image: busybox:1.37
        command: ["/lcm/lcm-gateway", "-listen", ":25565", "-tunnel-listen", ":7000", "-admin-listen", ":8080", "-token-file", "/secret/token"]
        ports: [{containerPort: 25565, name: mc}, {containerPort: 7000, name: tunnel}, {containerPort: 8080, name: admin}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}}
        volumeMounts: [{name: bin, mountPath: /lcm}, {name: secret, mountPath: /secret, readOnly: true}]
      volumes:
      - {name: bin, emptyDir: {}}
      - {name: secret, secret: {secretName: lcm-tunnel}}
---
apiVersion: v1
kind: Service
metadata: {name: lcm-gateway}
spec:
  selector: {app: lcm-gateway}
  ports: [{name: mc, port: 25565, targetPort: mc}, {name: admin, port: 8080, targetPort: admin}]
---
apiVersion: v1
kind: Service
metadata: {name: lcm-gateway-tunnel}
spec:
  selector: {app: lcm-gateway}
  ports: [{name: tunnel, port: 7000, targetPort: tunnel}]
